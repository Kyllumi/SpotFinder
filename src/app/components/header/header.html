<header class="home-top-bar">
  <div class="brand-section">
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Toggle Menu">
      ☰
    </button>
    <h1 (click)="onNavigate('')">🌲 SPOTFINDER</h1>

    <!-- Menu a tendina -->
    <div class="dropdown-menu" *ngIf="isMenuOpen">
      <a class="menu-item" (click)="onNavigate('')">🏠 Home</a>
      <a class="menu-item" (click)="onNavigate('map')">🗺️ Mappa</a>
      <a class="menu-item" (click)="toggleMenu()">❓ FAQ</a>
      <hr class="menu-divider" />
      <a class="menu-item" (click)="toggleMenu()">👤 Il mio account</a>
    </div>
  </div>

  <!-- Pulsanti Dinamici -->
  <div class="nav-actions">
    <!-- Se siamo sulla Mappa: Mostra "Aggiungi Spot" -->
    <button 
      *ngIf="isMapPage" 
      class="add-spot-btn" 
      (click)="onNewSpotClick()">
      ➕ Aggiungi uno Spot
    </button>

    <!-- Se siamo in altre pagine (es. Home): Mostra "Vai alla Mappa" -->
    <button 
      *ngIf="!isMapPage" 
      class="map-btn" 
      (click)="onNavigate('map')">
      🗺️ Vai alla Mappa
    </button>
  </div>
</header>
