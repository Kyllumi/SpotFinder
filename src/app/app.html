<div class="app-container" [class.map-view]="currentView === 'map'">
  <!-- Vista 1: Home Page -->
  <app-home-page
    *ngIf="currentView === 'home'"
    [spots]="spots"
    (navigate)="onNavigate($event)"
    (selectSpot)="onSelectSpot($event)">
  </app-home-page>

  <!-- Vista 2: Mappa e Sidebar -->
  <ng-container *ngIf="currentView === 'map'">
    <app-header 
      (navigate)="onNavigate($event)" 
      (createSpot)="openCreateForm()">
    </app-header>

    <div class="main-content">
      <aside class="sidebar">
        <app-spot-form 
          *ngIf="showForm" 
          [spotToEdit]="spotToEdit" 
          [initialCoords]="clickedCoords"
          (save)="onSaveSpot($event)" 
          (cancel)="closeForm()">
        </app-spot-form>

        <app-spot-detail 
          *ngIf="selectedSpot && !showForm" 
          [spot]="selectedSpot"
          (close)="selectedSpot = null"
          (edit)="openEditForm($event)"
          (delete)="onDeleteSpot($event)">
        </app-spot-detail>

        <app-spot-list 
          [spots]="spots"
          [selectedSpotId]="selectedSpot?.id || null"
          (spotSelected)="selectedSpot = $event">
        </app-spot-list>
      </aside>

      <main class="map-container">
        <app-map 
          [spots]="spots"
          [selectedSpot]="selectedSpot"
          (boundsChanged)="onBoundsChanged($event)"
          (mapClicked)="onMapClick($event)"
          (spotSelected)="selectedSpot = $event">
        </app-map>
      </main>
    </div>
  </ng-container>
</div>
